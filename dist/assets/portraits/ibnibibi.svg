<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_ibnibibi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182234"/>
      <stop offset="60%" stop-color="#701a75"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="halo_ibnibibi" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="seljuk_ibnibibi" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 40 20 L 20 40 L 0 20 Z" fill="none" stroke="#e879f9" stroke-width="0.75" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" rx="16" fill="url(#bg_ibnibibi)"/>
  <rect width="400" height="500" rx="16" fill="url(#seljuk_ibnibibi)"/>
  <circle cx="200" cy="180" r="140" fill="url(#halo_ibnibibi)"/>

  <!-- Outer Illuminated Border -->
  <rect x="16" y="16" width="368" height="468" rx="12" fill="none" stroke="#e879f9" stroke-width="2" stroke-opacity="0.7"/>
  <rect x="24" y="24" width="352" height="452" rx="8" fill="none" stroke="#e879f9" stroke-width="0.75" stroke-opacity="0.35" stroke-dasharray="6,4"/>

  <!-- Corner Jewels -->
  <circle cx="16" cy="16" r="5" fill="#e879f9"/>
  <circle cx="384" cy="16" r="5" fill="#e879f9"/>
  <circle cx="16" cy="484" r="5" fill="#e879f9"/>
  <circle cx="384" cy="484" r="5" fill="#e879f9"/>

  <!-- Central Medallion Frame -->
  <circle cx="200" cy="180" r="90" fill="#0f172a" stroke="#e879f9" stroke-width="3" stroke-opacity="0.9"/>
  <circle cx="200" cy="180" r="82" fill="none" stroke="#e879f9" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.6"/>

  <!-- 8-Pointed Seljuk Star around medallion -->
  <g transform="translate(200, 180)">
    <rect x="-65" y="-65" width="130" height="130" fill="none" stroke="#e879f9" stroke-width="1.2" stroke-opacity="0.4" transform="rotate(0)"/>
    <rect x="-65" y="-65" width="130" height="130" fill="none" stroke="#e879f9" stroke-width="1.2" stroke-opacity="0.4" transform="rotate(45)"/>
  </g>

  <!-- Large Icon Representation -->
  <text x="200" y="205" text-anchor="middle" font-size="70">📜</text>

  <!-- Name Ribbon & Text -->
  <g transform="translate(200, 320)">
    <rect x="-160" y="0" width="320" height="42" rx="21" fill="#0f172a" stroke="#e879f9" stroke-width="1.5" stroke-opacity="0.8"/>
    <text x="0" y="26" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold" font-family="'Cinzel Decorative', 'Cinzel', serif" letter-spacing="0.5">İbni Bibi</text>
  </g>

  <!-- Title & Era -->
  <text x="200" y="390" text-anchor="middle" fill="#e879f9" font-size="13" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600">Selçuklu Tarihçisi (XIII. yy)</text>

  <!-- Key Work Tag -->
  <g transform="translate(200, 425)">
    <rect x="-130" y="0" width="260" height="28" rx="14" fill="#701a75" stroke="#e879f9" stroke-width="1" stroke-opacity="0.5"/>
    <text x="0" y="18" text-anchor="middle" fill="#f1f5f9" font-size="12" font-family="'Plus Jakarta Sans', sans-serif">⚜️ el-Evâmirü'l-Alâiyye</text>
  </g>
</svg>