<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="parchmentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="50%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="seljukGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 60 30 L 30 60 L 0 30 Z" fill="none" stroke="#d4af37" stroke-width="0.5" stroke-opacity="0.08"/>
      <circle cx="30" cy="30" r="4" fill="none" stroke="#d4af37" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="600" fill="url(#parchmentGrad)"/>
  <rect width="1600" height="600" fill="url(#seljukGrid)"/>

  <!-- Mountain Silhouettes & Desert Dunes -->
  <path d="M 0 520 Q 200 480 400 500 T 800 490 T 1200 510 T 1600 480 L 1600 600 L 0 600 Z" fill="#182234" opacity="0.4"/>
  <path d="M 0 540 Q 300 510 600 530 T 1100 520 T 1600 530 L 1600 600 L 0 600 Z" fill="#1f2c42" opacity="0.5"/>

  <!-- Compass Rose (Tezhip Style) -->
  <g transform="translate(1450, 120)">
    <circle cx="0" cy="0" r="45" fill="#1e293b" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.5"/>
    <!-- Star Points -->
    <path d="M 0 -40 L 8 -12 L 35 0 L 8 12 L 0 40 L -8 12 L -35 0 L -8 -12 Z" fill="#d4af37" opacity="0.8"/>
    <path d="M 0 -40 L 5 -8 L 0 0 Z" fill="#fbbf24"/>
    <path d="M 0 40 L -5 8 L 0 0 Z" fill="#fbbf24"/>
    <circle cx="0" cy="0" r="5" fill="#f59e0b"/>
    <text x="0" y="-46" text-anchor="middle" fill="#d4af37" font-size="11" font-weight="bold" font-family="Cinzel, serif">K</text>
    <text x="0" y="56" text-anchor="middle" fill="#d4af37" font-size="11" font-weight="bold" font-family="Cinzel, serif">G</text>
    <text x="46" y="4" text-anchor="middle" fill="#d4af37" font-size="11" font-weight="bold" font-family="Cinzel, serif">D</text>
    <text x="-46" y="4" text-anchor="middle" fill="#d4af37" font-size="11" font-weight="bold" font-family="Cinzel, serif">B</text>
  </g>

  <!-- Route Title Banner -->
  <g transform="translate(800, 50)">
    <text x="0" y="0" text-anchor="middle" fill="#d4af37" font-size="20" font-family="'Cinzel Decorative', 'Cinzel', serif" font-weight="bold" letter-spacing="4">TÜRKİSTAN'DAN TÜRKİYE'YE KERVAN VE İLİM ROTASI</text>
    <text x="0" y="24" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="'Plus Jakarta Sans', sans-serif" letter-spacing="2">1040 — 1299 | TÜRK-İSLAM MEDENİYETİNİN KÜLTÜR VE BİLİM KÖPRÜSÜ</text>
    <path d="M -250 35 L 250 35" stroke="url(#goldLine)" stroke-width="1.5"/>
  </g>

  <!-- Caravan Trail Line -->
  <path id="caravanPath" d="M 180 380 C 320 280, 480 420, 680 320 C 850 240, 1020 360, 1180 280 C 1320 220, 1420 300, 1480 260" 
        fill="none" stroke="url(#goldLine)" stroke-width="4" stroke-dasharray="8,6" filter="url(#goldGlow)"/>

  <!-- Station 1: Türkistan (Sayram, Kaşgar, Balasagun) -->
  <g transform="translate(180, 380)">
    <circle cx="0" cy="0" r="18" fill="#1e3a8a" stroke="#fbbf24" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="6" fill="#fbbf24"/>
    <text x="0" y="38" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold" font-family="'Plus Jakarta Sans', sans-serif">TÜRKİSTAN</text>
    <text x="0" y="52" text-anchor="middle" fill="#d4af37" font-size="10" font-family="'Plus Jakarta Sans', sans-serif">Sayram • Kaşgar • Balasagun</text>
    <text x="0" y="-24" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="600">Başlangıç Noktası</text>
  </g>

  <!-- Station 2: Mâverâünnehir & Horasan -->
  <g transform="translate(520, 350)">
    <circle cx="0" cy="0" r="14" fill="#0f766e" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#fbbf24"/>
    <text x="0" y="32" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">HORASAN &amp; HARİZM</text>
    <text x="0" y="46" text-anchor="middle" fill="#d4af37" font-size="10">Buhara • Semerkand • Merv</text>
    <text x="0" y="-20" text-anchor="middle" fill="#34d399" font-size="10">İlim &amp; Rasathaneler</text>
  </g>

  <!-- Station 3: İsfahan & Bağdat -->
  <g transform="translate(850, 270)">
    <circle cx="0" cy="0" r="14" fill="#78350f" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#fbbf24"/>
    <text x="0" y="32" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">İSFAHAN &amp; BAĞDAT</text>
    <text x="0" y="46" text-anchor="middle" fill="#d4af37" font-size="10">Nizamiye Medreseleri • Gözlemevi</text>
    <text x="0" y="-20" text-anchor="middle" fill="#f59e0b" font-size="10">Büyük Selçuklu Merkezi</text>
  </g>

  <!-- Station 4: Diyarbakır / Cizre (Artuklu) -->
  <g transform="translate(1140, 290)">
    <circle cx="0" cy="0" r="14" fill="#831843" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#fbbf24"/>
    <text x="0" y="32" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">CİZRE &amp; DİYARBAKIR</text>
    <text x="0" y="46" text-anchor="middle" fill="#d4af37" font-size="10">Artuklu Sarayı • Cezeri'nin İcatları</text>
    <text x="0" y="-20" text-anchor="middle" fill="#f472b6" font-size="10">Mühendislik &amp; Sibernetik</text>
  </g>

  <!-- Station 5: Anadolu (Konya, Nevşehir, Malatya, Sivas) -->
  <g transform="translate(1420, 240)">
    <circle cx="0" cy="0" r="18" fill="#1b4332" stroke="#fbbf24" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="6" fill="#fbbf24"/>
    <text x="0" y="38" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">TÜRKİYE (ANADOLU)</text>
    <text x="0" y="52" text-anchor="middle" fill="#d4af37" font-size="10">Konya • Suluca Karahöyük • Malatya</text>
    <text x="0" y="-24" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="600">Tasavvuf &amp; Kültür Zirvesi</text>
  </g>

  <!-- Decorative Border Frame -->
  <rect x="15" y="15" width="1570" height="570" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="22" y="22" width="1556" height="556" fill="none" stroke="#d4af37" stroke-width="0.75" stroke-opacity="0.2"/>
  <!-- Corner Ornaments -->
  <g transform="translate(15,15)">
    <path d="M 0 0 L 25 0 L 25 5 L 5 5 L 5 25 L 0 25 Z" fill="#d4af37"/>
  </g>
  <g transform="translate(1585,15)">
    <path d="M 0 0 L -25 0 L -25 5 L -5 5 L -5 25 L 0 25 Z" fill="#d4af37"/>
  </g>
  <g transform="translate(15,585)">
    <path d="M 0 0 L 25 0 L 25 -5 L 5 -5 L 5 -25 L 0 -25 Z" fill="#d4af37"/>
  </g>
  <g transform="translate(1585,585)">
    <path d="M 0 0 L -25 0 L -25 -5 L -5 -5 L -5 -25 L 0 -25 Z" fill="#d4af37"/>
  </g>
</svg>
